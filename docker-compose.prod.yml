services:
  db:
    image: postgres:16-alpine
    container_name: medilens_postgres_prod
    restart: always
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgrespassword}
      POSTGRES_DB: ${POSTGRES_DB:-medilens_db}
    volumes:
      - pgdata_prod:/var/lib/postgresql/data
      - ./database/schema.sql:/docker-entrypoint-initdb.d/init.sql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d ${POSTGRES_DB:-medilens_db}"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - medilens_net
    deploy:
      resources:
        limits:
          cpus: "2.0"
          memory: 2048M

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile.prod
    container_name: medilens_backend_prod
    restart: always
    environment:
      - DATABASE_URL=postgresql+psycopg2://${POSTGRES_USER:-postgres}:${POSTGRES_PASSWORD:-postgrespassword}@db:5432/${POSTGRES_DB:-medilens_db}
      - ENVIRONMENT=production
      - DEBUG=False
      - SECRET_KEY=${SECRET_KEY}
      - LLM_PROVIDER=${LLM_PROVIDER:-gemini}
      - GEMINI_API_KEY=${GEMINI_API_KEY}
      - RATE_LIMIT_ENABLED=True
    volumes:
      - uploads_prod:/app/uploads
    depends_on:
      db:
        condition: service_healthy
    networks:
      - medilens_net
    deploy:
      resources:
        limits:
          cpus: "2.0"
          memory: 2048M

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: medilens_frontend_prod
    restart: always
    ports:
      - "80:80"
      - "443:443"
    depends_on:
      backend:
        condition: service_healthy
    networks:
      - medilens_net
    deploy:
      resources:
        limits:
          cpus: "1.0"
          memory: 1024M

networks:
  medilens_net:
    driver: bridge

volumes:
  pgdata_prod:
  uploads_prod:
